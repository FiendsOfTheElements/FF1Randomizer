version: 2.1

parameters:
  action:
    type: enum
    enum: [dry-run, prune-sites]
    default: dry-run

defaults: &defaults

  working_directory: ~/ff1randomizer
  # docker:
  #   - image: fiendsoftheelements/netlify-build:dotnet10
  docker:
    - image: cimg/base:current

orbs:
  shellcheck: circleci/shellcheck@1.3.16

jobs:
  dry-run:
    <<: *defaults
    steps:
      - checkout
      - run:
          name: dry-run
          command: .circleci/prune-sites.sh -d

  prune-sites:
    <<: *defaults
    steps:
      - checkout
      - run:
          name: prune-sitesmaxprune
          command: .circleci/prune-sites.sh -p

workflows:
  main:
    jobs:
      - shellcheck/check:
          path: ".circleci/"
      - dry-run:
          when: pipeline.parameters.action == "dry-run"
          requires:
            - shellcheck/check
      - prune-sites:
          when: pipeline.parameters.action == "prune-sites"
          requires:
            - shellcheck/check


